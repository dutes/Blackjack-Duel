<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Blackjack Duel</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0A0D0B" />
  <meta name="description" content="Head-to-head blackjack with a hidden bust. Best of three hands." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&family=Rye&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <span class="brand">Blackjack Duel</span>
      <div class="scoreline hidden" id="scoreline" aria-live="polite">
        <span class="lbl">OPP</span><span class="score" id="scoreText">0 – 0</span><span class="lbl">YOU</span>
      </div>
      <div class="phase hidden" id="phaseBox">
        <span class="phase-text" id="phaseText"></span>
        <div class="timer" id="timer"><div class="timer-fill" id="timerFill"></div></div>
        <span class="timer-text" id="timerText"></span>
      </div>
    </header>

    <section id="lobby" class="lobby">
      <div class="lobby-card" id="lobbyMain">
        <h1>Blackjack Duel</h1>
        <p class="tagline">Head-to-head blackjack with a hidden bust. Three hands, best score wins.</p>
        <div class="lobby-actions">
          <button id="friendBtn" class="btn gold big">Play a friend</button>
          <button id="botBtn" class="btn light big">Play the bot</button>
          <button id="tutorialBtn" class="btn outline big">Learn with the tutorial</button>
        </div>
        <button id="rulesBtn" class="linklike">How to play</button>
      </div>
      <div class="lobby-card hidden" id="lobbyWaiting">
        <div class="spinner" aria-hidden="true"></div>
        <p class="waiting-text" id="waitingText">Waiting for your opponent…</p>
        <div class="invite hidden" id="inviteBox">
          <label for="inviteInput">Send this link to a friend</label>
          <div class="invite-row">
            <input id="inviteInput" type="text" readonly />
            <button id="copyBtn" class="btn gold small">Copy</button>
          </div>
          <button id="openTabBtn" class="linklike">Or open a second tab to play yourself</button>
        </div>
        <button id="cancelBtn" class="linklike">Cancel</button>
      </div>
    </section>

    <main id="game" class="game hidden">
      <div class="rail">
        <div class="felt" id="felt">
          <div class="lanes" id="lanes"></div>
          <div class="felt-overlay hidden" id="feltOverlay" aria-live="assertive"></div>
        </div>
      </div>
      <section class="controls" id="controls" aria-label="Your move"></section>
    </main>
  </div>

  <div class="modal hidden" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-card" id="modalCard"></div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="popover hidden" id="popover" role="note"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="client.js"></script>
</body>
</html>
