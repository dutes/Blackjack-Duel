name: Tests

on:
  push:
  pull_request:

jobs:
  king-of-the-hill:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: king-of-the-hill
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: king-of-the-hill/package-lock.json

      - run: npm ci

      - name: Unit tests
        run: npm test

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Keep traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: king-of-the-hill/test-results/
